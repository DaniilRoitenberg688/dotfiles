[env]
TERM = "xterm-256color"


[font]
normal.family = "CaskaydiaCove Nerd Font Mono" # Replace with your preferred font
normal.style = "SemiBold"

bold.family = "CaskaydiaCove Nerd Font Mono" # Replace with your preferred font
bold.style = "Bold"
size = 11.5


[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = '#000000'

[window]
opacity = 0.9
blur = true
